# gitleaks 配置（R6 重写）——可选的本地辅助工具；权威门禁为
# scripts/scan_repo_secrets.py（结构性豁免）+ scripts/check_hits_manifest.py
# （按值哈希分类）+ scripts/verify_ipa.py（IPA 门禁）。历史命中不再按提交/路径
# 整类豁免；分类以 scripts/secret_classification.txt 的哈希清单为准。

[extend]
# 使用 gitleaks 默认规则集，下方 allowlist 仅镜像结构性豁免（与
# scripts/secret_allowlist.txt 同口径：只放「键名/合成变量名/结构性引用」，
# 绝不放真实值，不按路径豁免）。

[allowlist]
description = "JDLV R6: structural references only (mirrors scripts/secret_allowlist.txt)"
regexes = [
  '''secrets\.[A-Za-z0-9_]+''',
  '''MYSQL_ALLOW_EMPTY_PASSWORD''',
  '''JDLV_FIXTURE_PASS''',
  '''JDLV_KNOWN_SECRETS_FILE''',
  '''IDENTIFIED\s+.*BY\s+["']\$[A-Za-z_]+["']''',
]
