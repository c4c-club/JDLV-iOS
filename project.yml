name: JDLV
options:
  bundleIdPrefix: com.jdlv
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.7.0
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  JDLVCore:
    path: JDLVCore
  onnxruntime:
    # R7 P2 BLOCKED(ENV) 处置：microsoft/onnxruntime-swift-package-manager（连同主仓库）
    # 于 2026-11-18 全线 404（gh api + git ls-remote 双验证，见 docs/29 p2-ci-env-note.md）。
    # 切换到官方仓库 fork 的同源 tag：1.24.2 = commit b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2，
    # 提交者为 ORT 官方维护者 edgchen1（"Update ORT to 1.24.2 (#43)"，2026-02-25），
    # exactVersion 精确 pin 锁定该 commit，不跟随 fork 分支变化。
    # 官方仓库恢复后回滚：URL 改回 microsoft/onnxruntime-swift-package-manager 即可。
    # R6 SEG-06 BLOCKED(ENV) 处置：2026-11-21 起 download.onnxruntime.ai 证书失效
    # （SEC_E_WRONG_PRINCIPAL）且两个 pod 包 404 —— 上游 binaryTarget 无法下载，
    # iOS job 在依赖解析阶段必挂（run 44929124205 / 44929958858 双次实证）。
    # 处置：fork 同源 tag 1.24.2 到 c4c-club，仅把两个 binaryTarget URL 指向自有 release
    # （tag 1.24.2-r6），两个 zip 与原包字节一致（SHA256 已比对官方 pin：
    # f7100a99… / 346522d1…）。Package.swift 其余内容与 mobilyze-llc 1.24.2 完全相同。
    url: https://github.com/c4c-club/onnxruntime-swift-package-manager
    exactVersion: 1.24.2-r6
targets:
  JDLV:
    type: application
    platform: iOS
    sources:
      - path: JDLV
        excludes:
          - "Resources/Info.plist"
          - "**/*.txt"
          - "**/*.md"
          - "**/*.secret"
          - "**/*.credentials"
          - "**/mysql*"
          - "**/.env*"
          - "**/*.sql"
          - "**/*.db"
          - "**/*.sqlite*"
          - "**/*.log"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdlv.ios
        INFOPLIST_FILE: JDLV/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: JDLVCore
      - package: onnxruntime
        product: onnxruntime
  JDLVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JDLVTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: JDLV
  JDLVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JDLVUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # R5 P4 §3：固定 runner bundle id —— 导出步骤 get_app_container 按 id 找
        # xctrunner 数据容器（flushReport ③ 通道的临时文件）
        PRODUCT_BUNDLE_IDENTIFIER: com.jdlv.ios.UITests
    dependencies:
      - target: JDLV
schemes:
  JDLV:
    build:
      targets:
        JDLV: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JDLVTests
        - JDLVUITests
