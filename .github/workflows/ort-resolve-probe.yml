name: ort-resolve-probe
# TEMPORARY (R6 SEG-06): validates that the onnxruntime package resolves after the
# upstream CDN outage workaround. Delete after the R6 build is green.

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve package dependencies
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild -project JDLV.xcodeproj -scheme JDLV -sdk iphonesimulator -configuration Debug -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages -resolvePackageDependencies 2>&1 | tee build/resolve.log
      - name: Show resolved packages
        run: |
          find build/SourcePackages -name "Package.resolved" -maxdepth 4 | head -5
          head -40 build/SourcePackages/workspace-state.json 2>/dev/null || true
