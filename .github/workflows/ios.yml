name: ios

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      ui_filter:
        description: 'UI 测试过滤（only-testing 目标，逗号分隔，如 JDLVUITests/SettingsUITests,JDLVUITests/ProductionSmokeUITests；空 = 全量。R5 P3 引入，常驻）'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: repo hygiene guard
        # R10/C5/C9：与 scripts/guard_repo.sh 共用同一段逻辑（原样复制，禁止两处各写一套）。
        # 统一强模式：只认「引号包裹的口令字面量」；显式判空（不用 `! grep … | grep -q .` 假绿）。
        # CI checkout 无 docs/，`if [ -d docs ]` 自动跳过本地分支；`git ls-files docs` 恒为 0。
        run: |
          set -euo pipefail
          PAT="(PASSWORD|PASS|password|store[P]assword|key[P]assword)[[:space:]]*[:=][[:space:]]*[\"']"
          DOC_RE='(^|/)(README|CHANGELOG|LICENSE)|\.(md|txt|kt|gradle.*)$|(^|/)docs/'
          doc_hits=$(git ls-files | grep -Ei "$DOC_RE" | grep -vE '^scripts/secret_allowlist\.txt$' || true)
          [ -z "$doc_hits" ] || { echo 'guard FAIL: tracked doc files'; echo "$doc_hits"; exit 1; }
          [ "$(git ls-files docs | wc -l)" -eq 0 ] || { echo 'guard FAIL: docs tracked'; exit 1; }
          android_hits=$(git ls-files | grep -E 'JDLV-Mobile/app/sr[c]' || true)
          [ -z "$android_hits" ] || { echo 'guard FAIL: Android sources'; echo "$android_hits"; exit 1; }
          BENIGN="MYSQL_ALLOW_EMPTY_PASSWORD|PASS[A-Z_]*[[:space:]]*[:=][[:space:]]*\"\"|PASS[A-Z_]*[[:space:]]*=[[:space:]]*[\"']\\$\(openssl rand"
          cred_hits=$(git grep -InE "$PAT" -- . | grep -vE "$BENIGN" | cut -d: -f1 | sort -u || true)
          [ -z "$cred_hits" ] || { echo 'guard FAIL: credential literals in tracked tree'; echo "$cred_hits"; exit 1; }
          # R4 强模式 2：值形态凭据（排除 $VAR 引用 / 空串 / ALLOW_EMPTY 开关；
          #  mysql URL 限定常见用户名字符，规避扫描器源码自匹配）
          RPAT="(IDENTIFIED[[:space:]]+.*BY[[:space:]]*[\"'][^\"'\$]|[A-Z_]*PASSWORD[[:space:]]*[:=][[:space:]]*[\"'][^\"'\$]|TEST_RUNNER_[A-Z_]*PASS[A-Z_]*[[:space:]]*[:=][[:space:]]*[\"'][^\"'\$]|mysql://[A-Za-z0-9._%~+-]+:[^[:space:]@]+@)"
          rcred_hits=$(git grep -InE "$RPAT" -- . | grep -vE "$BENIGN" | cut -d: -f1 | sort -u || true)
          [ -z "$rcred_hits" ] || { echo 'guard FAIL: credential value literals in tracked tree'; echo "$rcred_hits"; exit 1; }
          if [ -d docs ]; then
            doccred=$(grep -rInE "$PAT" docs --exclude-dir=07_证据 2>/dev/null | grep -vE "$BENIGN" | cut -d: -f1 | sort -u || true)
            [ -z "$doccred" ] || { echo 'guard FAIL: credential literals in local docs/'; echo "$doccred"; exit 1; }
            git check-ignore -q docs/ || { echo 'guard FAIL: docs/ not gitignored'; exit 1; }
          fi
          grep -q 'MARKETING_VERSION: 1.6.1' project.yml || { echo 'guard FAIL: version'; exit 1; }
          # R3 门禁：键盘 API 审计（问题 1 —— asciiCapable/inputView/UIKeyInput 禁用）
          kb_hits=$(grep -R -E "asciiCapable|inputView|UIKeyInput" JDLV --include='*.swift' || true)
          [ -z "$kb_hits" ] || { echo 'guard FAIL: banned keyboard API (issue 1 audit)'; echo "$kb_hits"; exit 1; }
          echo 'keyboard audit: 0 hits'
          echo 'guard OK'

  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test (JDLVCore, unit only)
        run: |
          ln -sf /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 /usr/lib/x86_64-linux-gnu/libsqlite3.so
          swift test --package-path JDLVCore --skip JDLVCoreIntegrationTests

  core-mysql:
    needs: [guard]
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # R4：空口令账号在 MySQLNIO/caching_sha2 下无法连接（服务端按 used-password 校验）→
          # 改用每次 run 唯一的临时口令（github.run_id；非固定凭据、随 run 丢弃、不进任何密文）
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: integration tests (real MySQL 8)
        env:
          JDLV_TEST_MYSQL_HOST: mysql
          JDLV_TEST_MYSQL_PORT: "3306"
          JDLV_TEST_MYSQL_USER: root
          JDLV_TEST_MYSQL_PASS: ${{ github.run_id }}
        run: |
          ln -sf /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 /usr/lib/x86_64-linux-gnu/libsqlite3.so
          swift test --package-path JDLVCore --filter IntegrationTests

  ios:
    # R10/C2：MySQL 集成为强制门 —— core-mysql 红 = ios 不执行（needs 闭环，防带红发布）
    needs: [guard, core-linux, core-mysql]
    # macos-26 在 2026-11-04 起持续 "not acquired by Runner"（容量）→ 按规划 §2 兜底退 macos-15。
    # destination 由 simctl 动态解析（任意可用 iPhone），不写死机型。
    # R4：UI 套件扩到 24 用例 + ProductionSmoke 240s conn 等待 → 90min 上限不足（被 GitHub
    # 静默取消），加到 150min。
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Resolve simulator destination
        run: |
          set -e
          xcrun simctl list devices available
          xcrun simctl list runtimes
          NAME=$(xcrun simctl list devices available | sed -nE 's/^ *(iPhone 17 [^(]*) \([0-9A-F-]{36}\).*/\1/p' | head -1 | xargs)
          if [ -z "$NAME" ]; then
            NAME=$(xcrun simctl list devices available | sed -nE 's/^ *(iPhone [^(]*) \([0-9A-F-]{36}\).*/\1/p' | head -1 | xargs)
          fi
          # OS 从设备列表的分区头解析（设备仅存在于已配对的 runtime；runtimes 列表可能含无设备的旧版）
          OSV=$(xcrun simctl list devices available | grep -oE "^-- iOS [0-9.]+" | grep -oE "[0-9.]+" | tail -1)
          test -n "$NAME" && test -n "$OSV"
          echo "DEST=platform=iOS Simulator,name=${NAME},OS=${OSV}" >> "$GITHUB_ENV"
          echo "Using destination: $DEST"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Resource tree gate (R4 V5)
        run: bash scripts/check_resource_tree.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build (Debug, iphonesimulator)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild -project JDLV.xcodeproj -scheme JDLV -sdk iphonesimulator -configuration Debug -destination "$DEST" -derivedDataPath build/DerivedData build 2>&1 | tee build/build.log

      - name: Start MySQL fixture (App unit tests use Db facade end-to-end)
        run: |
          set -e
          brew install mysql@8.0
          echo "$(brew --prefix)/opt/mysql@8.0/bin" >> "$GITHUB_PATH"
          brew services start mysql@8.0
          for i in $(seq 1 60); do
            if mysql -uroot -e 'select 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          mysql -uroot -e 'select 1'
          FIXTURE_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$FIXTURE_PASS"
          echo "JDLV_FIXTURE_PASS=$FIXTURE_PASS" >> "$GITHUB_ENV"
          mysql -uroot -e "CREATE DATABASE IF NOT EXISTS jdlv_app_it CHARACTER SET utf8mb4"
          # 专用 fixture 账号 + mysql_native_password（口令每次运行随机生成 + add-mask，不入 YAML）
          mysql -uroot -e "CREATE USER IF NOT EXISTS 'jdlv_it'@'%' IDENTIFIED WITH mysql_native_password BY '$FIXTURE_PASS'"
          mysql -uroot -e "GRANT ALL ON jdlv_app_it.* TO 'jdlv_it'@'%'"
          mysql -uroot -e "FLUSH PRIVILEGES"

      - name: Disable hardware keyboard (XCUITest typeText needs software keyboard)
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          echo "hardware keyboard disabled for simulator"

      - name: Test
        env:
          # TEST_RUNNER_ 前缀：xcodebuild 转发进测试进程（剥前缀）；单测与 UI 测试 runner 都可见
          TEST_RUNNER_JDLV_TEST_MYSQL_HOST: "127.0.0.1"
          TEST_RUNNER_JDLV_TEST_MYSQL_PORT: "3306"
          TEST_RUNNER_JDLV_TEST_MYSQL_USER: jdlv_it
          TEST_RUNNER_JDLV_TEST_MYSQL_PASS: ${{ env.JDLV_FIXTURE_PASS }}
        run: |
          set -eo pipefail
          # R4 P8：拆 build-for-testing / test-without-building —— 测试 target 编译错误
          # 直接落盘可上传（此前 test target 编译挂时 test.log 未产出，诊断盲区）
          xcodebuild -project JDLV.xcodeproj -scheme JDLV -sdk iphonesimulator -configuration Debug -destination "$DEST" -derivedDataPath build/DerivedData build-for-testing 2>&1 | tee build/build-for-testing.log
          # R5 P3：workflow_dispatch 输入 ui_filter → only-testing 目标列表（空 = 全量）
          ONLY=()
          if [ -n "${{ github.event.inputs.ui_filter || '' }}" ]; then
            IFS=',' read -ra TARGETS <<< "${{ github.event.inputs.ui_filter }}"
            for t in "${TARGETS[@]}"; do ONLY+=("-only-testing:${t// /}"); done
          fi
          # R5 P3 2A: boot the DEST simulator first, then stream its unified log in the
          # background for the whole test run (xcodebuild shuts the sim down on exit,
          # so post-hoc `log show` finds nothing).
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 Pro (" | grep -oE "[0-9A-F-]{36}" | head -1 || true)
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
            (xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "JDLV"' > build/app-perf-log.txt 2>&1 &) || true
            echo "perf log stream started on $UDID"
          else
            echo 'no iPhone 17 Pro device found for perf log stream' > build/app-perf-log.txt
          fi
          set +e
          xcodebuild -project JDLV.xcodeproj -scheme JDLV -sdk iphonesimulator -configuration Debug -destination "$DEST" -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult test-without-building "${ONLY[@]}" 2>&1 | tee build/test.log
          TEST_RC=$?
          set -e
          pkill -f "log stream" 2>/dev/null || true
          sleep 2
          wc -c build/app-perf-log.txt || true
          exit $TEST_RC

      - name: Export UI test attachments
        if: always()
        run: |
          mkdir -p build/attachments
          xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/attachments || echo 'no attachments (non-blocking evidence export)'
          # R5 P3 §2A：导出应用埋点日志（settings-perf subsystem），对齐 idle 卡点实测
          # R5 P3 2A: copy the app-internal perf log out of the data container
          for UDID in $(xcrun simctl list devices | grep -E "iPhone 17 Pro" | grep -oE "[0-9A-F-]{36}"); do
            APPCONT=$(xcrun simctl get_app_container "$UDID" com.jdlv.ios data 2>/dev/null || true)
            if [ -n "$APPCONT" ] && [ -f "$APPCONT/tmp/jdlv-perf.log" ]; then
              cp "$APPCONT/tmp/jdlv-perf.log" build/attachments/app-perf-log.txt || true
              break
            fi
          done
          if [ ! -f build/attachments/app-perf-log.txt ]; then echo "no app perf log (tried all iPhone 17 Pro devices)" > build/attachments/app-perf-log.txt; fi
          fi
          # 附件重命名：xcresulttool 以 UUID 落盘 → 按 manifest.json 还原真实附件名
          # （NN-页面名.png / layout-report.json / screenshots-manifest.json）
          python3 - <<'PYRENAME'
          import json, os, re
          d = "build/attachments"
          mp = os.path.join(d, "manifest.json")
          if not os.path.exists(mp):
              print("no xcresult manifest.json; keep UUID names")
          else:
              raw = json.load(open(mp, encoding="utf-8"))
              def walk(o):
                  if isinstance(o, dict):
                      yield o
                      for v in o.values():
                          yield from walk(v)
                  elif isinstance(o, list):
                      for v in o:
                          yield from walk(v)
              ren = 0
              # xcresulttool suggested name 形如 "<附件名>_<序号>_<UUID>.<ext>"
              suffix = re.compile(r'^(.*?)_\d+_[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}(\.[A-Za-z0-9]+)$')
              seen = set()
              for e in walk(raw):
                  src = e.get("exportedFileName") if isinstance(e, dict) else None
                  name = (e.get("suggestedHumanReadableName")
                          or e.get("attachmentName") or "") if isinstance(e, dict) else ""
                  if not src or not name or src == "manifest.json" or src in seen:
                      continue
                  seen.add(src)
                  sp = os.path.join(d, src)
                  if not os.path.exists(sp):
                      continue
                  m = suffix.match(name)
                  base = (m.group(1) + m.group(2)) if m else name
                  base = re.sub(r'[^A-Za-z0-9._-]', '_', base)
                  if not base.lower().endswith(('.png', '.json', '.txt', '.mp4')):
                      base += '.txt'
                  dst = os.path.join(d, base)
                  if dst != sp and not os.path.exists(dst):
                      os.replace(sp, dst)
                      ren += 1
              if ren == 0:
                  print("DIAG first manifest node:", json.dumps(raw, ensure_ascii=False)[:600])
              print("renamed %d attachments" % ren)
          PYRENAME

      - name: Verify screenshots (R3 gate)
        if: always()
        run: |
          set -eo pipefail
          cd build/attachments 2>/dev/null || { echo 'no attachments dir'; exit 1; }
          # screenshots-manifest（字符串附件）导出为 UUID.txt → 按内容定位
          MANIFEST=$(grep -l 'pageName' ./*.txt ./*.json 2>/dev/null | head -1 || true)
          # --min 16：17 张清单中 12-top250 在 blocker B1（CI demo 入口不可达）时缺席
          # diag-* = 失败诊断截图（无测试色，非页面验收对象）→ 排除
          PNGS=$(ls ./*.png 2>/dev/null | grep -v '/diag-' || true)
          python3 -I "$GITHUB_WORKSPACE/scripts/verify_screenshots.py" $PNGS ${MANIFEST:+--manifest "$MANIFEST"} --min 16

      - name: Verify layout report (R3 gate)
        if: always()
        run: |
          set -eo pipefail
          cd build/attachments 2>/dev/null || { echo 'no attachments dir'; exit 1; }
          # layout-report（字符串附件）导出为 UUID.txt → 按内容定位
          REPORT=$(grep -l 'violations' ./*.txt ./*.json 2>/dev/null | head -1 || true)
          if [ -z "$REPORT" ]; then echo 'FAIL layout-report.json missing (LayoutAuditUITests did not run)'; exit 1; fi
          python3 -I "$GITHUB_WORKSPACE/scripts/verify_layout.py" "$REPORT"

      - name: Package simulator app
        run: |
          set -e
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/JDLV.app JDLV-Simulator.app.zip

      - name: Archive unsigned IPA
        run: |
          set -e
          xcodebuild -project JDLV.xcodeproj -scheme JDLV -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath build/JDLV.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          rm -rf Payload
          mkdir -p Payload
          cp -R build/JDLV.xcarchive/Products/Applications/JDLV.app Payload/
          zip -qry JDLV-unsigned.ipa Payload
          # R10：grep 不带 -q —— minos 16.0 行必须进 CI 日志（set -e 下不命中仍失败），供证据抓行
          otool -l Payload/JDLV.app/JDLV | grep 'minos 16.0'

      - name: Verify IPA (security gate)
        run: bash scripts/verify_ipa.sh JDLV-unsigned.ipa

      - name: Upload simulator zip
        uses: actions/upload-artifact@v4
        with:
          name: JDLV-Simulator-app-zip
          path: JDLV-Simulator.app.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JDLV-unsigned-ipa
          path: JDLV-unsigned.ipa

      - name: Upload UI test attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-attachments
          path: build/attachments
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Upload crash reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-reports
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/Retired/*.ips
          if-no-files-found: ignore

  security:
    # R4 Phase 2：历史凭据扫描门（PR + tag + dispatch；release needs 闭环）。
    # 分类结论（docs/20_证据_R4 security/history-classification.md）：历史命中全部是
    # .github/workflows/ios.yml 的历史版本（CI 合成值 root/jdlv_it，非生产、不可达，HEAD 已清零）。
    # 门禁规则：HIT 路径只能是 ios.yml 历史版本；出现其它路径 → FAIL。
    # R5 Phase 1：workflow_dispatch 纳入触发（发布前演练）；新增 head 模式扫描门
    # （当前 HEAD 必须 0 命中；run_id 表达式等合成形态由扫描器记 ALLOWED，不计 HIT）。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: head secret scan (working tree, must be 0)
        run: python3 scripts/scan_repo_secrets.py --root . --mode head --out /tmp/head.txt
      - name: gate head scan
        run: |
          set -euo pipefail
          HITS=$(grep -c '^HIT' /tmp/head.txt || true)
          echo "head hits: $HITS"
          [ "$HITS" = "0" ] || { echo 'security FAIL: working-tree secret hits'; cat /tmp/head.txt; exit 1; }
          echo 'security OK (head clean)'
      - name: scanner self-tests (positive/negative fixtures)
        run: python3 -I scripts/test_scan_repo_secrets.py
      - name: history secret scan (strong value patterns)
        run: python3 scripts/scan_repo_secrets.py --root . --mode history --out /tmp/history.txt
      - name: classify and gate
        run: |
          set -euo pipefail
          HITS=$(grep -c '^HIT' /tmp/history.txt || true)
          echo "history hits: $HITS"
          OTHER=$(grep '^HIT' /tmp/history.txt | grep -v 'path=\.github/workflows/ios\.yml' || true)
          [ -z "$OTHER" ] || { echo 'security FAIL: unclassified history hits'; echo "$OTHER"; exit 1; }
          echo 'security OK (all history hits are classified ios.yml historical blobs)'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # R10/C2：等全部 job 成功才发布（R4 起 security 纳入 needs）
    needs: [guard, core-linux, core-mysql, ios, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JDLV-unsigned-ipa
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: JDLV-Simulator-app-zip
          path: dist
      - name: Re-verify IPA (security gate)
        run: bash scripts/verify_ipa.sh dist/JDLV-unsigned.ipa
      - name: Checksums + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          sha256sum JDLV-unsigned.ipa JDLV-Simulator.app.zip > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "JDLV iOS ${GITHUB_REF_NAME} binaries" JDLV-unsigned.ipa JDLV-Simulator.app.zip SHA256SUMS.txt
